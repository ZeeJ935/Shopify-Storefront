# Render Blueprint for the backend API and its Postgres (see backend/README.md → Deploy on Render).
# The storefront itself stays on Vercel.
services:
  - type: web
    name: zj-backend
    runtime: node
    rootDir: backend
    # Starter is always on. "free" sleeps after 15 min idle (first request then waits about a minute).
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate:prod
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: zj-backend-db
          property: connectionString
      # Render generates this; copy it into Vercel as BACKEND_SERVICE_TOKEN.
      - key: BACKEND_SERVICE_TOKEN
        generateValue: true
      # Shopify admin → Settings → Notifications → Webhooks ("Your webhooks will be signed with …").
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      # The storefront's public origin, e.g. https://shopify-storefront-ruby.vercel.app
      - key: STOREFRONT_URL
        sync: false
      # Catalog sync: same values as the storefront's.
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_STOREFRONT_ACCESS_TOKEN
        sync: false
      # Error reporting (optional): the backend project's DSN from sentry.io.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

databases:
  - name: zj-backend-db
    databaseName: zj_backend
    # Free databases are deleted 30 days after creation (plus a 14-day grace period).
    plan: basic-256mb
