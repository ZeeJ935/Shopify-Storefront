# Local Postgres for the backend. Host port 5433 so it doesn't clash with a
# Postgres already installed on 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zj
      POSTGRES_PASSWORD: zj
      POSTGRES_DB: zj_backend
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zj -d zj_backend"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
