name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Route/layout types (e.g. the global LayoutProps) are generated by Next
      # into .next/types, which is gitignored; generate them without a build.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # `next build` prerenders pages from Shopify, so it needs the store secrets
      # (Settings → Secrets and variables → Actions). Without them, for example on
      # a pull request from a fork, the build is skipped instead of failing.
      - name: Build
        if: env.SHOPIFY_STORE_DOMAIN != ''
        run: npm run build
      - name: Build skipped
        if: env.SHOPIFY_STORE_DOMAIN == ''
        run: echo "::notice::next build skipped — Shopify secrets are not available to this run."
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
      SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID: ${{ secrets.SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID }}
      SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_SECRET: ${{ secrets.SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_SECRET }}
      SHOPIFY_CUSTOMER_ACCOUNT_SHOP_ID: ${{ secrets.SHOPIFY_CUSTOMER_ACCOUNT_SHOP_ID }}
      SHOPIFY_CUSTOMER_ACCOUNT_CALLBACK_URL: ${{ secrets.SHOPIFY_CUSTOMER_ACCOUNT_CALLBACK_URL }}
      SHOPIFY_CUSTOMER_ACCOUNT_SESSION_SECRET: ${{ secrets.SHOPIFY_CUSTOMER_ACCOUNT_SESSION_SECRET }}

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zj
          POSTGRES_PASSWORD: zj
          POSTGRES_DB: zj_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zj -d zj_backend"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://zj:zj@127.0.0.1:5432/zj_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Proves the committed migrations apply cleanly to an empty database.
      - name: Migrations
        run: npm run db:migrate

      - name: Tests
        run: npm test
